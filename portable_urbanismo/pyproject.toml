[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanismo-entorno"
version = "0.1.0"
description = "Proxy urbanístico por contexto: infiere retranqueos, ocupación y edificabilidad observando el entorno construido"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.23.0",
    "shapely>=2.0.0",
    "geopandas>=0.12.0",
]

# Distribución de un único módulo: tras instalar -> `import urbanismo_proxy`
[tool.setuptools]
py-modules = ["urbanismo_proxy"]
